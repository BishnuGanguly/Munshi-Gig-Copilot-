[project]
name = "munshi-gig-copilot"
version = "0.2.0"
description = "Voice-first earnings and expense assistant for Indian gig workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "imageio-ffmpeg>=0.5",  # bundled ffmpeg, so no system install is needed
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]  # optional free offline STT fallback
llm = ["anthropic>=0.40"]  # optional Claude-based translation fallback (paid)

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
